# Isolated test only: place this file on the named validation branch at
# .github/workflows/fork-autosync.yml. Never install this version on main.
# The default branch must already contain a workflow at the same path with
# workflow_dispatch enabled, so the GitHub Actions UI can dispatch this test.
name: Fork token write check (isolated branch)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-token-write-check
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'zayn-0101/NotionNext' &&
      github.ref == 'refs/heads/codex/fork-sync-write-check-20261108'
    runs-on: ubuntu-latest
    steps:
      - name: Verify token authentication
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::FORK_SYNC_TOKEN is missing.'
            exit 1
          fi
          if ! token_owner=$(gh api user --jq '.login'); then
            echo '::error::FORK_SYNC_TOKEN could not authenticate.'
            exit 1
          fi
          token_owner=$(printf '%s' "$token_owner" | LC_ALL=C tr '[:upper:]' '[:lower:]')
          repository_owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')
          if [[ "$token_owner" != "$repository_owner" ]]; then
            echo '::error::FORK_SYNC_TOKEN belongs to a different account.'
            exit 1
          fi
          echo 'Token authenticated as the repository owner.'

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/fork-sync-write-check-20261108
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Test writing a workflow file on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/fork-sync-write-check-20261108'
          workflow='.github/workflows/fork-autosync.yml'
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::The branch changed after this run was requested.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\n# Token write validation run %s\n' "$GITHUB_RUN_ID" >> "$workflow"
          git add -- "$workflow"
          git diff --cached --check
          git commit -m '验证同步令牌写入权限'
          git push origin "HEAD:refs/heads/$branch"
          echo 'Token wrote a workflow file to the isolated branch.'
